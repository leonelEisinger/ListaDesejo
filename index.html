<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header class="hero text-center text-white d-flex align-items-center">
        <div class="container">
            <h1 id="main-text" class="display-3">Lista de Presentes</h1>
        </div>
    </header>

    <section class="container my-5">

        <div class="row mb-4">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="Procurar Pelo Nome...">
            </div>

            <div class="col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="all">Todas as Categorias</option>
                </select>
            </div>
            <div class="col-md-4 d-grid gap-2">
                <a class="btn btn-info" href="pages/taste.html">Gostos</a>
            </div>
        </div>

        <div class="row" id="giftContainer">
        </div>

    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script/app.js"></script>
</body>
</html>
